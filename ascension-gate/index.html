  <div id="app" aria-live="polite">
    <div class="avvio"><div class="avvio-segno"></div><p>Apertura del Gate…</p></div>
  </div>
  <script src="vendor/cytoscape.min.js" defer></script>
  <script src="vendor/cytoscape-dagre.js" defer></script>

<style>.guscio,.giocatori{height:calc(100vh - var(--demo-h,0px)) !important;height:calc(100dvh - var(--demo-h,0px)) !important}</style>
<script>
(function(){var small=matchMedia("(max-width: 600px)").matches;var b=document.createElement("div");b.setAttribute("role","note");
b.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:9999;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:nowrap;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:#0b0b0b;color:#ffd60a;font:600 12px/1.3 system-ui,sans-serif;border-top:3px solid #ffd60a";
b.innerHTML='<span>'+(small?'Demo con dati di fantasia':'Demo con dati di fantasia: tutto resta nel tuo browser.')+'</span><button type="button" id="ag-reset" style="background:#ffd60a;color:#0b0b0b;border:0;border-radius:8px;padding:4px 9px;font:700 12px system-ui;cursor:pointer;white-space:nowrap">Ripristina</button><a href="../" style="color:#fff;white-space:nowrap">← Progetti</a>';
document.addEventListener("DOMContentLoaded",function(){document.body.appendChild(b);document.documentElement.style.setProperty("--demo-h",b.offsetHeight+"px");document.getElementById("ag-reset").onclick=function(){try{localStorage.removeItem("ag-demo-v1");localStorage.removeItem("ag-coda");}catch(e){}location.hash="";location.reload();};});})();
</script>
